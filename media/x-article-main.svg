<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="640" viewBox="0 0 1600 640" role="img" aria-labelledby="title desc">
  <title id="title">An inbox and wallet for your AI agent</title>
  <desc id="desc">A clean Mermail-style hero with a white background, cyan glow, dotted grid, navigation, headline, and calls to action.</desc>
  <defs>
    <linearGradient id="wash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e6f8fc"/>
      <stop offset=".42" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#effcff"/>
    </linearGradient>
    <radialGradient id="cyanGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#7ce3e8" stop-opacity=".52"/>
      <stop offset="1" stop-color="#7ce3e8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.25" fill="#b9e7ea" opacity=".72"/>
    </pattern>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
  </defs>

  <rect width="1600" height="640" fill="url(#wash)"/>
  <ellipse cx="-25" cy="110" rx="300" ry="235" fill="url(#cyanGlow)" filter="url(#soft)"/>
  <ellipse cx="1630" cy="580" rx="330" ry="220" fill="url(#cyanGlow)" filter="url(#soft)"/>
  <rect y="145" width="1600" height="495" fill="url(#dots)" opacity=".5"/>

  <g font-family="Inter, Arial, Helvetica, sans-serif" fill="#0b1115">
    <g transform="translate(112 52)">
      <path d="M0 9c8-12 16-12 24 0l8 12 8-12c8-12 16-12 24 0l-6 6c-4-6-7-6-11 0L32 35 17 15c-4-6-7-6-11 0Z" fill="#081014"/>
      <text x="72" y="28" font-size="25" font-weight="800" letter-spacing="-1.3">mermail</text>
    </g>

    <g font-size="16" font-weight="600" fill="#263137">
      <text x="505" y="78">Agents</text>
      <text x="598" y="78">Build⌄</text>
      <text x="696" y="78">Usecase⌄</text>
      <text x="817" y="78">Resources⌄</text>
      <text x="950" y="78">Leaderboard</text>
      <text x="1086" y="78">Pricing</text>
    </g>

    <rect x="1365" y="43" width="144" height="52" rx="13" fill="#49c8cd"/>
    <text x="1390" y="76" font-size="15" font-weight="800" fill="#071317">Get started</text>
    <text x="1476" y="76" font-size="20" font-weight="700" fill="#071317">→</text>

    <g text-anchor="middle">
      <text x="800" y="210" font-size="65" font-weight="800" letter-spacing="-3.2">An <tspan fill="#19a7b0">inbox</tspan> and <tspan fill="#19a7b0">wallet</tspan></text>
      <text x="800" y="286" font-size="65" font-weight="800" letter-spacing="-3.2">for your AI agent.</text>
      <text x="800" y="363" font-size="22" font-weight="500" fill="#67767c">Give your agent an email identity and access to controlled</text>
      <text x="800" y="394" font-size="22" font-weight="500" fill="#67767c">payments. Run auto GTM workflows, resolve support requests, and</text>
      <text x="800" y="425" font-size="22" font-weight="500" fill="#67767c">handle online purchases. You decide what your agent can do.</text>
    </g>

    <g transform="translate(625 468)">
      <rect width="158" height="54" rx="12" fill="#49c8cd"/>
      <text x="25" y="34" font-size="16" font-weight="800" fill="#071317">Start free</text>
      <text x="123" y="35" font-size="23" font-weight="700" fill="#071317">→</text>
    </g>
    <g transform="translate(800 468)">
      <rect width="158" height="54" rx="12" fill="#ffffff" fill-opacity=".76" stroke="#b9d8dc" stroke-width="2"/>
      <text x="26" y="34" font-size="16" font-weight="700" fill="#263137">Get a demo</text>
      <text x="127" y="35" font-size="23" font-weight="700" fill="#263137">→</text>
    </g>
    <text x="800" y="563" text-anchor="middle" font-size="15" font-weight="600" fill="#7b898d">Start with an inbox. Connect a wallet when you need it.</text>
  </g>

  <rect x="82" y="606" width="1436" height="34" rx="17" fill="#f7feff" stroke="#c7e7ea" stroke-width="2"/>
</svg>